<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Inject</title>
<style>
body{font-family:monospace;background:#111;color:#0f0;padding:16px;font-size:12px;line-height:2}
pre{background:#000;padding:8px;border-radius:8px;white-space:pre-wrap;word-break:break-all;max-height:500px;overflow-y:auto;color:#0ff;font-size:11px}
.err{color:#f44}.ok{color:#0f0}.warn{color:#ff0}
</style>
</head>
<body>
<h2 style="color:#fff">Debug: FacultyQ Injection</h2>
<div id="OUT"></div>
<script src="db.js"></script>
<script src="topics.js"></script>
<script src="exams.js"></script>
<script>
var out=document.getElementById("OUT");
function log(m,c){var d=document.createElement("div");d.className=c||"";d.textContent=new Date().toLocaleTimeString()+" | "+m;out.appendChild(d)}
function show(d){var p=document.createElement("pre");p.textContent=typeof d==="string"?d:JSON.stringify(d,null,2);out.appendChild(p)}

var EX=window.EXAMS||{};

log("EXAMS loaded, keys: "+Object.keys(EX).join(", "));
log("CA Foundation papers: "+(EX.ca_foundation?Object.keys(EX.ca_foundation.papers).join(", "):"NOT FOUND"));

AIEP.init(function(connected){
    log("AIEP.init done, connected: "+connected, connected?"ok":"err");

    if(connected){
        AIEP.subscribe();

        // Check immediately
        var fq1=AIEP.getFacultyQ();
        log("getFacultyQ() immediately: "+Object.keys(fq1).length+" keys","warn");
        if(Object.keys(fq1).length>0){
            log("Keys: "+Object.keys(fq1).join(", "),"ok");
        }

        // Check after 2 seconds
        setTimeout(function(){
            var fq2=AIEP.getFacultyQ();
            log("getFacultyQ() at 2s: "+Object.keys(fq2).length+" keys","warn");
            var keys=Object.keys(fq2);
            for(var i=0;i<keys.length;i++){
                var k=keys[i];
                var qs=fq2[k];
                log("  "+k+": "+qs.length+" questions");
                if(qs.length>0){
                    log("    First Q: "+qs[0].q.substring(0,60)+"...");
                    log("    opts keys: "+Object.keys(qs[0].opts).join(","));
                    log("    ans: "+qs[0].ans);
                }
            }

            // Try injection
            var exKeys=Object.keys(EX);
            for(var k=0;k<keys.length;k++){
                var key=keys[k];
                var examKey=null,paperKey=null;
                for(var e=0;e<exKeys.length;e++){
                    if(key===exKeys[e]){
                        examKey=exKeys[e];paperKey=null;break;
                    }
                    if(key.startsWith(exKeys[e]+"_")){
                        examKey=exKeys[e];
                        paperKey=key.substring(exKeys[e].length+1);
                        break;
                    }
                }
                log("Key '"+key+"' -> examKey="+examKey+", paperKey="+paperKey, examKey?"ok":"err");
                if(examKey&&paperKey&&EX[examKey]&&EX[examKey].papers[paperKey]){
                    var qs=fq2[key];
                    log("  Injecting "+qs.length+" questions into "+examKey+"."+paperKey,"ok");
                    EX[examKey].papers[paperKey].qs=qs;
                    log("  EX["+examKey+"].papers["+paperKey+"].qs.length = "+EX[examKey].papers[paperKey].qs.length,"ok");
                }else{
                    log("  SKIP: examKey="+examKey+" paperKey="+paperKey+" exists="+(examKey&&EX[examKey]&&EX[examKey].papers[paperKey]),"err");
                }
            }
        },2000);

        // Check after 5 seconds
        setTimeout(function(){
            var fq3=AIEP.getFacultyQ();
            log("getFacultyQ() at 5s: "+Object.keys(fq3).length+" keys","warn");
            if(EX.ca_foundation&&EX.ca_foundation.papers.accounting){
                log("CA Foundation Accounting qs.length: "+EX.ca_foundation.papers.accounting.qs.length, EX.ca_foundation.papers.accounting.qs.length>0?"ok":"err");
            }
        },5000);
    }
});
</script>
</body>
</html>
