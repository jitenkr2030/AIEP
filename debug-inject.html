<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Inject</title>
<style>
body{font-family:monospace;background:#111;color:#0f0;padding:16px;font-size:12px;line-height:2}
pre{background:#000;padding:8px;border-radius:8px;white-space:pre-wrap;word-break:break-all;max-height:500px;overflow-y:auto;color:#0ff;font-size:11px}
.err{color:#f44}.ok{color:#0f0}.warn{color:#ff0}
</style>
</head>
<body>
<h2 style="color:#fff">Debug: FacultyQ Injection (v2)</h2>
<div id="OUT"></div>
<script src="db.js"></script>
<script src="topics.js"></script>
<script src="exams.js"></script>
<script>
var out=document.getElementById("OUT");
function log(m,c){var d=document.createElement("div");d.className=c||"";d.textContent=new Date().toLocaleTimeString()+" | "+m;out.appendChild(d)}

var EX=window.EXAMS||{};
log("EXAMS loaded: "+Object.keys(EX).length+" exams");

// Sort exam keys longest first - same as fixed app.js
var exKeys=Object.keys(EX).sort(function(a,b){return b.length - a.length});
log("Sorted keys (first 10): "+exKeys.slice(0,10).join(", "));

AIEP.init(function(connected){
    log("Connected: "+connected, connected?"ok":"err");
    if(connected) AIEP.subscribe();

    // Check at 2s, 4s, 6s
    [2000,4000,6000].forEach(function(delay){
        setTimeout(function(){
            var fq=AIEP.getFacultyQ();
            var keys=Object.keys(fq);
            log("--- Check at "+(delay/1000)+"s: "+keys.length+" keys ---","warn");

            var injected=0, skipped=0;
            for(var k=0;k<keys.length;k++){
                var key=keys[k];
                var examKey=null, paperKey=null;
                for(var e=0;e<exKeys.length;e++){
                    if(key.indexOf(exKeys[e]+"_")===0){
                        examKey=exKeys[e];
                        paperKey=key.substring(exKeys[e].length+1);
                        break;
                    }
                }
                if(examKey && paperKey && EX[examKey] && EX[examKey].papers[paperKey]){
                    var qs=fq[key];
                    // Actually inject
                    var enc=function(s){return btoa(unescape(encodeURIComponent(s)))};
                    var newQs=[];
                    for(var i=0;i<qs.length;i++){
                        newQs.push({id:qs[i].id,t:enc(qs[i].q),o:{A:enc(qs[i].opts.A),B:enc(qs[i].opts.B),C:enc(qs[i].opts.C||""),D:enc(qs[i].opts.D||"")},a:enc(qs[i].ans)});
                    }
                    EX[examKey].papers[paperKey].qs=newQs;
                    log("INJECTED "+newQs.length+" into "+examKey+"."+paperKey,"ok");
                    injected++;
                }else{
                    log("SKIP "+key+" -> exam="+examKey+" paper="+paperKey,"err");
                    skipped++;
                }
            }
            log("Summary: "+injected+" injected, "+skipped+" skipped","warn");

            // Verify
            if(EX.ca_foundation && EX.ca_foundation.papers.accounting){
                log("VERIFY: ca_foundation.accounting has "+EX.ca_foundation.papers.accounting.qs.length+" questions", EX.ca_foundation.papers.accounting.qs.length>0?"ok":"err");
            }
        },delay);
    });
});
</script>
</body>
</html>
