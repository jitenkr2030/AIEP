<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Test</title>
<style>
body{font-family:monospace;background:#111;color:#0f0;padding:16px;font-size:12px;line-height:2}
pre{background:#000;padding:8px;border-radius:8px;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto;color:#0ff;font-size:11px}
</style>
</head>
<body>
<h2 style="color:#fff">API FacultyQ Test</h2>
<div id="OUT"></div>
<script>
var out=document.getElementById("OUT");
function log(m){var d=document.createElement("div");d.textContent=m;out.appendChild(d)}
function show(d){var p=document.createElement("pre");p.textContent=JSON.stringify(d,null,2);out.appendChild(p)}

fetch("/api/query",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({facultyq:{}})})
.then(function(r){return r.json()})
.then(function(data){
    log("API returned:");
    show(data);
    log("Type: "+typeof data);
    log("Keys: "+Object.keys(data));
    if(data.facultyq){
        log("facultyq type: "+typeof data.facultyq);
        log("facultyq is array: "+Array.isArray(data.facultyq));
        if(Array.isArray(data.facultyq)){
            log("facultyq length: "+data.facultyq.length);
            if(data.facultyq.length>0){
                log("First item keys: "+Object.keys(data.facultyq[0]));
                log("First item paperKey: "+data.facultyq[0].paperKey);
            }
        }else{
            log("facultyq keys: "+Object.keys(data.facultyq));
        }
    }
})
.catch(function(e){log("Error: "+e.message)});
</script>
</body>
</html>
