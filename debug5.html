<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write + Read Test</title>
<style>
body{font-family:monospace;background:#111;color:#0f0;padding:16px;font-size:12px;line-height:2}
button{background:#7C3AED;color:#fff;border:none;padding:12px 20px;font-size:14px;font-weight:700;border-radius:8px;margin:4px;width:100%}
.pass{color:#0f0}.fail{color:#f00}.warn{color:#ff0}
pre{background:#000;padding:8px;border-radius:8px;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto;color:#0ff;font-size:11px}
</style>
</head>
<body>
<h2 style="color:#fff">Write + Read Test</h2>
<button onclick="doTest()">Run</button>
<div id="OUT"></div>

<script src="instant.min.js"></script>
<script>
var out=document.getElementById("OUT");
function log(m,c){var d=document.createElement("div");d.className=c||"";d.textContent=m;out.appendChild(d)}
function showData(label,data){var d=document.createElement("div");var h=document.createElement("b");h.textContent=label;d.appendChild(h);var pre=document.createElement("pre");pre.textContent=JSON.stringify(data,null,2);d.appendChild(pre);out.appendChild(d)}

function doTest(){
    out.innerHTML="";
    var db=instant.init({appId:"52877744-72cc-404a-b68e-fb01f3e387ac"});
    log("Connected to InstantDB","pass");

    // Write
    var testId="writetest_"+Date.now();
    log("Writing to portalusers...");
    try{
        db.transact(db.tx.portalusers[testId].update({
            name:"Write Test",
            email:"writetest@test.com",
            phone:"1234567890",
            roll:"TEST001",
            tier:"free",
            joined:new Date().toISOString()
        }));
        log("Write sent!","pass");
    }catch(e){
        log("Write error: "+e.message,"fail");
    }

    // Subscribe and read back
    log("Subscribing to read data...");
    db.subscribeQuery({portalusers:{}},function(resp){
        if(resp.error){
            log("SUBSCRIBE ERROR:","fail");
            showData("Error",resp.error);
            return;
        }
        log("Got data from cloud!","pass");
        showData("All portalusers",resp.data);
    });

    // Also subscribe to results
    db.subscribeQuery({results:{}},function(resp){
        if(resp.error){
            log("Results ERROR:","fail");
            showData("Error",resp.error);
            return;
        }
        log("Got results!","pass");
        showData("All results",resp.data);
    });
}
</script>
</body>
</html>
