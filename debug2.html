<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDN Test</title>
<style>
body{font-family:monospace;background:#111;color:#0f0;padding:16px;font-size:13px;line-height:2}
button{background:#1D4ED8;color:#fff;border:none;padding:10px 16px;font-size:13px;font-weight:700;border-radius:8px;margin:4px;width:100%}
.pass{color:#0f0}.fail{color:#f00}
</style>
</head>
<body>
<h2 style="color:#fff">CDN Test</h2>
<button onclick="testCDN()">Test CDN Load</button>
<div id="OUT"></div>
<script>
function log(m,c){var d=document.createElement("div");d.className=c||"";d.textContent=m;document.getElementById("OUT").appendChild(d)}
function testCDN(){
    document.getElementById("OUT").innerHTML="";
    log("Loading https://unpkg.com/@instantdb/core ...");
    var s=document.createElement("script");
    s.src="https://unpkg.com/@instantdb/core";
    s.onload=function(){
        log("PASS: CDN loaded!","pass");
        log("typeof instant = "+typeof instant);
        if(typeof instant!=="undefined"){
            try{
                var db=instant.init({appId:"52877744-72cc-404a-b68e-fb01f3e387ac"});
                log("PASS: DB init OK!","pass");
                db.transact(db.tx.portalusers["cdn_test"].update({name:"CDN Test",email:"cdn@test.com",phone:"",roll:"",tier:"free",joined:new Date().toISOString()}));
                log("PASS: Write sent! Check Explorer","pass");
            }catch(e){
                log("FAIL: Init error: "+e.message,"fail");
            }
        }else{
            log("FAIL: instant is undefined after load","fail");
        }
    };
    s.onerror=function(){
        log("FAIL: CDN could not load","fail");
        log("Possible: network blocked or CDN down","fail");
    };
    document.head.appendChild(s);
    setTimeout(function(){
        if(typeof instant==="undefined"){
            log("TIMEOUT: CDN did not load in 10 seconds","fail");
        }
    },10000);
}
</script>
</body>
</html>
