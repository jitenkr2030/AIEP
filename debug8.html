<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIEP API Test</title>
<style>
body{font-family:monospace;background:#111;color:#0f0;padding:16px;font-size:12px;line-height:2}
button{background:#7C3AED;color:#fff;border:none;padding:12px 20px;font-size:14px;font-weight:700;border-radius:8px;margin:4px;width:100%}
.pass{color:#0f0}.fail{color:#f00}
</style>
</head>
<body>
<h2 style="color:#fff">AIEP API Test</h2>
<button onclick="doTest()">Test</button>
<div id="OUT"></div>

<script src="instant.min.js"></script>
<script src="db.js"></script>
<script>
var out=document.getElementById("OUT");
function log(m,c){var d=document.createElement("div");d.className=c||"";d.textContent=m;out.appendChild(d)}

function doTest(){
    out.innerHTML="";
    log("1. Calling AIEP.init()...");
    AIEP.init(function(ok){
        if(ok){
            log("   Connected!","pass");
        }else{
            log("   Failed!","fail");
            return;
        }

        log("2. Calling AIEP.saveUser()...");
        AIEP.saveUser({
            name:"API Test User",
            email:"apitest@test.com",
            phone:"1111111111",
            roll:"API001",
            tier:"free"
        });
        log("   saveUser called","pass");

        log("3. Calling AIEP.saveResult()...");
        AIEP.saveResult({
            name:"API Test User",
            email:"apitest@test.com",
            roll:"API001",
            exam:"Test Exam",
            paper:"Paper 1",
            score:50,
            total:100,
            pct:50
        });
        log("   saveResult called","pass");

        log("4. AIEP.isConnected() = "+AIEP.isConnected());

        log("5. Waiting 5 seconds then subscribing...");
        setTimeout(function(){
            AIEP.subscribe();
            AIEP.on("data",function(d){
                var u=Object.keys(d.portalusers||{}).length;
                var r=Object.keys(d.results||{}).length;
                log("6. Cloud portalusers: "+u, u>0?"pass":"fail");
                log("   Cloud results: "+r, r>0?"pass":"fail");
            });
        },5000);

        log("7. Now check InstantDB Explorer","pass");
    });
}
</script>
</body>
</html>
