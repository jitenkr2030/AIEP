<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug 7</title>
<style>
body{font-family:monospace;background:#111;color:#0f0;padding:16px;font-size:12px;line-height:2}
button{background:#7C3AED;color:#fff;border:none;padding:12px 20px;font-size:14px;font-weight:700;border-radius:8px;margin:4px;width:100%}
.pass{color:#0f0}.fail{color:#f00}
pre{background:#000;padding:8px;border-radius:8px;white-space:pre-wrap;word-break:break-all;color:#0ff;font-size:11px}
</style>
</head>
<body>
<h2 style="color:#fff">Debug 7</h2>
<button onclick="doTest()">Write and Wait</button>
<div id="OUT"></div>

<script src="instant.min.js"></script>
<script>
var out=document.getElementById("OUT");
function log(m,c){var d=document.createElement("div");d.className=c||"";d.textContent=m;out.appendChild(d)}
function show(d){var p=document.createElement("pre");p.textContent=JSON.stringify(d,null,2);out.appendChild(p)}

// Create ONE instance only
var db=instant.init({appId:"52877744-72cc-404a-b68e-fb01f3e387ac"});

function doTest(){
    out.innerHTML="";
    log("Single db instance created","pass");

    log("Writing 1 user...");
    var id="u_"+Date.now();
    db.transact(db.tx.portalusers[id].update({
        name:"Final Test",
        email:"final@test.com",
        phone:"9999999999",
        roll:"TEST999",
        tier:"free",
        joined:new Date().toISOString()
    }));

    log("Writing 1 result...");
    var rid="r_"+Date.now();
    db.transact(db.tx.results[rid].update({
        name:"Final Test",
        email:"final@test.com",
        roll:"TEST999",
        exam:"Test Exam",
        paper:"Paper 1",
        score:80,
        total:100,
        pct:80,
        date:new Date().toISOString()
    }));

    log("Writing 1 voucher...");
    db.transact(db.tx.vouchers["TESTCODE"].update({
        desc:"Test Voucher",
        used:0,
        max:100,
        tier:"starter"
    }));

    log("All writes sent!","pass");
    log("");
    log("NOW: Go to InstantDB Explorer","warn");
    log("https://instantdb.com/dash","warn");
    log("Click AIEP > Explorer","warn");
    log("Check if rows appear","warn");
    log("");
    log("Waiting 10 seconds to re-check...");

    // Single subscribe after 10 seconds
    setTimeout(function(){
        log("Checking after 10 seconds...");
        db.subscribeQuery({portalusers:{},results:{},vouchers:{}},function(resp){
            if(resp.error){
                log("ERROR:","fail");
                show(resp.error);
                return;
            }
            var u=Object.keys(resp.data.portalusers||{}).length;
            var r=Object.keys(resp.data.results||{}).length;
            var v=Object.keys(resp.data.vouchers||{}).length;
            log("portalusers: "+u, u>0?"pass":"fail");
            log("results: "+r, r>0?"pass":"fail");
            log("vouchers: "+v, v>0?"pass":"fail");
            show(resp.data);
        });
    },10000);
}
</script>
</body>
</html>
