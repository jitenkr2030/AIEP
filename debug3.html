<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDN Test 3</title>
<style>
body{font-family:monospace;background:#111;color:#0f0;padding:16px;font-size:13px;line-height:2}
button{background:#1D4ED8;color:#fff;border:none;padding:10px 16px;font-size:13px;font-weight:700;border-radius:8px;margin:4px;width:100%}
.pass{color:#0f0}.fail{color:#f00}.warn{color:#ff0}
</style>
</head>
<body>
<h2 style="color:#fff">CDN Test 3</h2>
<button onclick="test1()">Test unpkg</button>
<button onclick="test2()">Test jsdelivr</button>
<button onclick="test3()">Test cdnjs</button>
<button onclick="test4()">Test esm.sh</button>
<div id="OUT"></div>
<script>
var out=document.getElementById("OUT");
function log(m,c){var d=document.createElement("div");d.className=c||"";d.textContent=m;out.appendChild(d)}

function test1(){testURL("https://unpkg.com/@instantdb/core","unpkg")}
function test2(){testURL("https://cdn.jsdelivr.net/npm/@instantdb/core","jsdelivr")}
function test3(){testURL("https://cdnjs.cloudflare.com/ajax/libs/instantdb-core/latest/index.js","cdnjs")}
function test4(){testURL("https://esm.sh/@instantdb/core","esm.sh")}

function testURL(url,name){
    log("Testing: "+name+" ...");
    var s=document.createElement("script");
    s.src=url;
    s.onload=function(){log("  PASS: "+name+" loaded!","pass");log("  typeof instant = "+typeof instant,"pass")};
    s.onerror=function(){log("  FAIL: "+name+" blocked","fail")};
    document.head.appendChild(s);
    setTimeout(function(){if(typeof instant==="undefined"&&s.onload){log("  TIMEOUT: "+name,"fail")}},8000);
}
</script>
</body>
</html>
