<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIEP Debug</title>
<style>
body{font-family:monospace;background:#111;color:#0f0;padding:16px;font-size:13px;line-height:2}
button{background:#1D4ED8;color:#fff;border:none;padding:10px 16px;font-size:13px;font-weight:700;border-radius:8px;margin:4px;width:100%}
.pass{color:#0f0}.fail{color:#f00}.warn{color:#ff0}
</style>
</head>
<body>
<h2 style="color:#fff">AIEP Cloud Debug</h2>
<button onclick="runAll()">Run All Tests</button>
<div id="OUT" style="margin-top:16px"></div>

<script src="db.js"></script>
<script>
var out = document.getElementById("OUT");
function log(m,c){var d=document.createElement("div");d.className=c||"";d.textContent=m;out.appendChild(d)}

function runAll(){
    out.innerHTML="";

    // Test 1
    log("TEST 1: AIEP loaded");
    if(typeof AIEP!=="undefined") log("  PASS","pass");
    else{ log("  FAIL","fail"); return; }

    // Test 2
    log("TEST 2: localStorage data");
    log("  Users: "+AIEP.getUsers().length);
    log("  Results: "+AIEP.getResults().length);
    log("  Vouchers: "+Object.keys(AIEP.getVouchers()).length);

    // Test 3
    log("TEST 3: Connecting to InstantDB...");
    AIEP.init(function(ok){
        if(ok){
            log("  PASS: Connected!","pass");

            // Test 4
            log("TEST 4: Writing test data...");
            try{
                AIEP.db.transact(
                    AIEP.db.tx.portalusers["debugtest1"].update({
                        name:"Debug Test",
                        email:"debug@test.com",
                        phone:"",
                        roll:"",
                        tier:"free",
                        joined: new Date().toISOString()
                    })
                );
                log("  PASS: Write sent!","pass");
                log("  Check InstantDB Explorer now","warn");
            }catch(e){
                log("  FAIL: "+e.message,"fail");
            }

            // Test 5
            log("TEST 5: Syncing all local data...");
            AIEP.syncAllToCloud(function(r){
                if(r.ok){
                    log("  PASS: "+JSON.stringify(r.stats),"pass");
                }else{
                    log("  FAIL: "+r.msg,"fail");
                }
            });

        }else{
            log("  FAIL: Not connected","fail");
            log("  Check your internet connection","warn");
        }
    });
}
</script>
</body>
</html>
